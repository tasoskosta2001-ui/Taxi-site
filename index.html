<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyprus Taxi24/7</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
      background: url('mercedes-taxi.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Σκούρο layer για να φαίνεται καθαρά το κείμενο */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    header {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      font-size: 14px;
      z-index: 1;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      position: relative;
      z-index: 1;
      max-width: 90%;
    }

    .hero h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }

    .hero p {
      font-size: 1.2em;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #25d366;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: 0.2s;
    }

    .btn:hover {
      background: #1ebd5a;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      font-size: 12px;
      color: #ccc;
      z-index: 1;
    }
  </style>
</head>
<body>
  <header>
    <div>📞 <a href="tel:+35797797750">+357 977 977 50</a></div>
    <div>🟢 Open 24/7</div>
  </header>

  <div class="hero">
    <h1>Welcome to Cyprus Taxi24/7 🚖</h1>
    <p>Reliable Airport & City Transfers in Cyprus</p>
    <a class="btn" href="https://wa.me/35797797750?text=Hello%2C%20I%20want%20to%20book%20a%20taxi%20in%20Cyprus.">📱 Book via WhatsApp</a>
  </div>

  <footer>
    © 2025 Cyprus Taxi24/7. All rights reserved.
  </footer>
</body>
</html>
